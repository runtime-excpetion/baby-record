# 宝宝成长记录系统 · 整项目单镜像 docker-compose
#
# 一键启动（内置 PostgreSQL，自动建表 + 种子数据 + 前后端）：
#   docker compose up -d --build
#   访问 http://localhost:8080
#
# 连接外部 PostgreSQL：
#   注释掉 postgres 服务与 app.depends_on，并将 app.environment 的 DATABASE_* 改为外部地址。

services:
  app:
    build: .
    container_name: baby-record-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - API_PREFIX=api/v1
      - SWAGGER_PATH=docs
      # 必须在宿主机环境或项目 .env 中设置，不写入镜像
      - BABY_RECORD_PASSWORD=${BABY_RECORD_PASSWORD:?BABY_RECORD_PASSWORD is required}
      - BABY_RECORD_SESSION_DAYS=30
      # 当前 compose 默认通过 HTTP 访问；配置 HTTPS 反代后请改为 true
      - BABY_RECORD_COOKIE_SECURE=${BABY_RECORD_COOKIE_SECURE:-false}
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-baby_record}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-baby_record}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-change-this-database-password}
      - DATABASE_URL=${DATABASE_URL:-postgresql://baby_record:change-this-database-password@postgres:5432/baby_record?schema=public}
    # depends_on:
    #   postgres:
    #     condition: service_healthy

