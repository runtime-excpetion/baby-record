# 宝宝成长记录系统 · 整项目单镜像 docker-compose
#
# 一键启动（外部 PostgreSQL + 前后端）：
#   cp .env.example .env
#   编辑 .env 后执行 docker compose up -d --build
#   访问 http://localhost:8080

services:
  app:
    build: .
    container_name: baby-record-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - API_PREFIX=api/v1
      - SWAGGER_PATH=docs
      - BABY_RECORD_PASSWORD=${BABY_RECORD_PASSWORD:?BABY_RECORD_PASSWORD is required}
      - BABY_RECORD_SESSION_DAYS=${BABY_RECORD_SESSION_DAYS:-30}
      - BABY_RECORD_COOKIE_SECURE=${BABY_RECORD_COOKIE_SECURE:-false}
      - DATABASE_HOST=${DATABASE_HOST:?DATABASE_HOST is required}
      - DATABASE_PORT=${DATABASE_PORT:-3308}
      - DATABASE_NAME=${DATABASE_NAME:-baby-db}
      - DATABASE_USERNAME=${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      # 后端根据以上分项配置生成 DATABASE_URL，避免端口或数据库名称不一致
      - DATABASE_URL=

    # 启用内置 PostgreSQL 时取消以下注释
    # depends_on:
